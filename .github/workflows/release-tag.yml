name: 節目の版のリリース

# 節目の版 (v*) のリリースを、手で実行して作る。入力は patch/minor/major、または X.Y.Z の直接指定。
# patch/minor/major は、直前の v* タグから上げる。対象のコミットには、CI が通って作られた build-<hash> のリリースが
# 必要 (publish-version-tag.js が確かめる)。同じ版のタグがあれば、作らずに止まる
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch/minor/major (直前の v* から上げる) か、X.Y.Z (そのまま使う)'
        required: true
        type: string
      sha:
        description: 'タグを打つコミット (空なら、実行するブランチの最新)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-tag:
    name: 節目の版のリリースの作成
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || github.sha }}
          # 直前の v* タグを探すので、履歴とタグをすべて取る
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: タグを打つコミットを確かめる
        run: echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: pnpm build
      - name: 版を決めて、GitHub Releases に置く
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION_INPUT: ${{ inputs.version }}
        run: node scripts/workflows/release/publish-version-tag.js
