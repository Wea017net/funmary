name: Publish npm

# npm のパッケージ (funmary、@funmary/client、@funmary/mcp) を、手で実行して公開する。3 つは、同じ版で出す。
# 入力は、patch/minor/major (npm にある、いちばん新しい版から上げる) か、X.Y.Z (1.0.0-beta.0 のような先行版も可)。公開したあと、版を package.json に書き込んだコミットと、
# npm-v<版> のタグを、GitHub App (funmary-release) の名前で main に push する (main は保護されていて、App だけが、ruleset の例外になっている)。
#
# npm の trusted publishing (OIDC) で公開するので、npm のトークンを secret に置かない。provenance (どのコミットから、
# どのワークフローで作ったか) が付く。npm 側で、パッケージごとに、このリポジトリとこのワークフローのファイル名
# (publish-npm.yml) を、公開者として登録しておく。
# 公開したあと、npm-v<版> のタグと GitHub Release を作る (v* は、アプリ本体の節目の版が使っているので、別の名前にする)。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch/minor/major (npm にある、いちばん新しい版から上げる) か、X.Y.Z (1.0.0-beta.0 のような先行版も可)'
        required: true
        type: string
      dist_tag:
        description: 'npm の dist-tag。空なら、先行版は先行版の名前 (beta など)、通常の版は latest'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: npm への公開
    # 公開するのは、main の最新から。ほかのブランチからは、公開しない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # タグと GitHub Release を作るのに要る
      contents: write
      # npm の trusted publishing が、OIDC のトークンを受け取るのに要る
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # main への push に使う、短い期間だけ有効な App のトークン
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup
      # 版と dist-tag を決め、後の手順に、環境変数 (VERSION、NPM_TAG、PRERELEASE) で渡す
      - name: 公開する版を決める
        env:
          VERSION_INPUT: ${{ inputs.version }}
          DIST_TAG_INPUT: ${{ inputs.dist_tag }}
        run: node scripts/workflows/npm/resolve-npm-version.js
      # CI と同じ検査を通ってから公開する (E2E は、PR で通したものとする)
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # gitHead は、npm の画面が、元のコミットを表示するのに使う。npm は、ディレクトリから公開するときだけ自動で入れる
      # (ここでは pnpm pack の tar.gz を公開するので、入らない) ため、公開するコミットを、自分で書き込む
      - name: 版とコミットを、公開する 3 つの package.json に書き込む (gitHead は、リポジトリには戻さない)
        run: |
          node -e "
            const fs = require('node:fs');
            for (const dir of ['client', 'mcp', 'funmary']) {
              const file = 'packages/public/' + dir + '/package.json';
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.version = process.env.VERSION;
              pkg.gitHead = process.env.GITHUB_SHA;
              fs.writeFileSync(file, JSON.stringify(pkg, null, '\t') + '\n');
            }
          "
      - run: pnpm --filter @funmary/client --filter @funmary/mcp --filter funmary build
      # workspace:* の依存を、公開する版に書き換えて、tar.gz にする。npm の CLI で、その tar.gz を公開する
      - name: tar.gz を作る
        run: |
          mkdir -p tarballs
          for dir in client mcp funmary; do (cd "packages/public/$dir" && pnpm pack --pack-destination ../../../tarballs); done
          ls tarballs
      # 公開は、依存される順 (client、mcp、funmary)。npm にある版は飛ばすので、途中で失敗しても、やり直せる
      - run: npm install -g npm@11
      - name: 公開する
        run: |
          publish() {
            NAME="$1"; FILE="$2"
            if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
              echo "$NAME@$VERSION は、すでに公開されているので、飛ばします"
            else
              npm publish "./tarballs/$FILE" --access public --provenance --tag "$NPM_TAG"
            fi
          }
          publish @funmary/client "funmary-client-$VERSION.tgz"
          publish @funmary/mcp "funmary-mcp-$VERSION.tgz"
          publish funmary "funmary-$VERSION.tgz"
      # 版だけをコミットして、main に push する (gitHead は戻さない)。[skip ci] で、CI と、本番へのデプロイは動かさない
      - name: 版のコミットを、main に push する
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git checkout -- packages/public
          node -e "
            const fs = require('node:fs');
            for (const dir of ['client', 'mcp', 'funmary']) {
              const file = 'packages/public/' + dir + '/package.json';
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.version = process.env.VERSION;
              fs.writeFileSync(file, JSON.stringify(pkg, null, '\t') + '\n');
            }
          "
          USER_ID=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$USER_ID+$APP_SLUG[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "版は、すでに package.json にあります"
          else
            git commit -am "chore(release): npm パッケージを v$VERSION にする [skip ci]"
            git push origin HEAD:main
          fi
      # アプリ本体の更新は、最新の Release (latest) を見るので、npm の Release は、latest にしない
      - name: タグと GitHub Release を作る
        run: |
          if gh release view "npm-v$VERSION" >/dev/null 2>&1; then
            echo "npm-v$VERSION の Release は、すでにあります"
          else
            FLAG="--latest=false"
            if [ "$PRERELEASE" = "true" ]; then FLAG="--prerelease"; fi
            gh release create "npm-v$VERSION" --target "$(git rev-parse HEAD)" --title "npm パッケージ v$VERSION" --generate-notes "$FLAG"
          fi
