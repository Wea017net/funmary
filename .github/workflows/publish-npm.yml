name: Publish npm

# main の CI が成功したら、npm にまだない版のパッケージ (funmary、@funmary/client、@funmary/mcp) を公開する。
# 版は、Changesets で上げる: 公開するパッケージを変えた PR に、pnpm changeset で変更の説明を足し、
# 版を上げるときに pnpm changeset version を実行して、その変更を PR にして、main に入れる。
#
# npm の trusted publishing (OIDC) で公開するので、npm のトークンを secret に置かない。provenance (どのコミットから、
# どのワークフローで作ったか) が付く。npm 側で、パッケージごとに、このリポジトリとこのワークフローを、公開者として登録しておく。
# 登録を終えて、リポジトリの変数 NPM_PUBLISH_ENABLED を true にするまでは、何もしない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: npm への公開
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm の trusted publishing が、OIDC のトークンを受け取るのに要る
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
      - run: pnpm --filter @funmary/client --filter @funmary/mcp --filter funmary build
      # npm にまだない版だけを公開する (ある版は、飛ばす)。公開しないパッケージは、private なので対象外
      - run: pnpm changeset publish
