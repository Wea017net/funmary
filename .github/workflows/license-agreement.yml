name: ライセンスへの同意の Worker の反映

# apps/license-agreement (外部の人の PR で、ライセンスへの同意を求める Worker、Issue #235) が main で変わったら、
# Cloudflare Workers に反映する。作者が準備 (apps/license-agreement/README.md) を終え、リポジトリの変数
# LICENSE_AGREEMENT_DEPLOY_ENABLED を true にするまでは動かさない
on:
  push:
    branches: [main]
    paths:
      - 'apps/license-agreement/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-agreement-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers に反映
    if: vars.LICENSE_AGREEMENT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # CI とは別に動くので、反映の前に、この Worker の型とテストを確かめる
      - run: pnpm --filter @funmary/license-agreement typecheck
      - run: pnpm vitest run --project license-agreement
      - name: D1 のマイグレーションと Worker を反映する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @funmary/license-agreement run deploy
