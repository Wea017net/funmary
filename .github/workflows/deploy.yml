name: Deploy

# リリースができたら、SSH で VPS に反映を頼む。
# VPS では funmary-update が版の名前を確かめ、update.sh が取得から切り戻しまでを行う。
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# 同時に動く反映は 1 つだけ。実行中のものは取り消さず、次を待たせる
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: VPS への反映
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      # Release の成果物 (released-sha) を取るため
      actions: read
    env:
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: false
      # 反映する版は、起動元の Release が作ったものにする (この実行の head_sha は、起動した時点の main の最新で、違うことがある)
      - name: Release が作った版を受け取る
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name released-sha --dir "$RUNNER_TEMP/released"
      - name: VPS に反映を頼む
        env:
          RELEASED_SHA_FILE: ${{ runner.temp }}/released/released-sha
        run: node scripts/workflows/deploy/request-deploy.js
