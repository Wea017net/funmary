# gitleaks の設定。既定のルールに、除外する場所だけを足す
[extend]
useDefault = true

[[allowlists]]
description = "外部から取り込んだ AI エージェント向けのスキル。説明のための偽のトークンを含む"
paths = ['''^\.agents/skills/''']

[[allowlists]]
description = "設定の検査のテストが使う、Discord の Bot のトークンの形をした架空の値"
paths = ['''^apps/web/src/lib/server/config\.test\.ts$''']
regexes = ['''MTIzNDU2Nzg5MDEyMzQ1Njc4\.Gabcde\.''']

[[allowlists]]
description = "GitHub App の秘密鍵 (PEM) を読む処理と、そのテストがその場で作る鍵。本物の鍵は含まない (Issue #235)"
targetRules = ['private-key']
paths = [
  '''^apps/license-agreement/src/github\.ts$''',
  '''^apps/license-agreement/src/github\.test\.ts$''',
]
